name = "sloe"
grammar = "sloe"
path_suffixes = ["sloe"]
line_comments = ["# "]
word_characters = ["-"]
completion_query_characters = ["-"]
brackets = [
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
  { start = "(", end = ")", close = true, newline = false, not_in = [] },
  { start = "{", end = "}", close = true, newline = false, not_in = [] },
  { start = "[", end = "]", close = true, newline = false, not_in = [] },
  { start = ":", end = " =\n", close = true, newline = false, not_in = ["string",  "comment"] },
]
