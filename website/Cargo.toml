[package]
name = "website"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "sloe_website"
path = "main.rs"

[dependencies]
sloe_compile = { path = "../compile/" }
gen-lsp-types = "0.9.0"
web-sys = { version = "0.3.91", features = [ "Event", "Location", "Window", "History" ] }
yew = { version = "0.23.0", features = [ "csr" ] }
